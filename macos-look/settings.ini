[org/gnome/desktop/interface]
gtk-theme='WhiteSur-Dark'
icon-theme='WhiteSur-dark'
cursor-theme='WhiteSur-cursors'
font-name='Inter 10'
document-font-name='Inter 10'
clock-format='12h'
clock-show-weekday=true

[org/gnome/desktop/wm/preferences]
titlebar-font='Inter Semi-Bold 10'
button-layout='close,minimize,maximize:appmenu'

[org/gnome/desktop/background]
picture-uri='file:///home/anurag/.local/share/backgrounds/WhiteSur-dark.jpg'
picture-options='zoom'

[org/gnome/desktop/screensaver]
picture-uri='file:///home/anurag/.local/share/backgrounds/WhiteSur-dark.jpg'

[org/gnome/shell/extensions/user-theme]
name='WhiteSur-Dark'

[org/gnome/shell/extensions/dash-to-dock]
dock-position='BOTTOM'
extend-height=false
dock-fixed=false
intellihide=true
dash-max-icon-size=44
running-indicator-style='DOTS'
custom-theme-customize-running-dots=true
custom-theme-running-dots-color='#d8d8d8'
custom-theme-running-dots-border-color='#d8d8d8'
custom-theme-running-dots-border-width=0
click-action='previews'
show-apps-at-top=false
show-trash=false
show-mounts=false
